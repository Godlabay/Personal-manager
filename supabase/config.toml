# Supabase local config. Generated by `supabase init` and hand-tuned.
# See https://supabase.com/docs/guides/cli/config

project_id = "personal-manager"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "personalmanager://auth-callback"
additional_redirect_urls = ["personalmanager://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

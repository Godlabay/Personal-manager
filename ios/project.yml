name: PersonalManager

options:
  bundleIdPrefix: app.personalmanager
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEVELOPMENT_TEAM: ""          # set in Xcode or override in CI
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.21.0
  YouTubePlayerKit:
    url: https://github.com/SvenTiigi/YouTubePlayerKit
    from: 1.8.0

targets:
  PersonalManager:
    type: application
    platform: iOS
    sources:
      - path: PersonalManager
        excludes:
          - "**/*.md"
    resources:
      - path: PersonalManager/Resources
      - path: ../prompts
        type: folder
    info:
      path: PersonalManager/Resources/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Personal Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "We use the microphone only when you tap the voice-capture button, to turn your spoken notes into tasks. Recognition runs on-device whenever possible."
        NSSpeechRecognitionUsageDescription: "We use speech recognition to turn your voice notes into tasks. It runs on-device when your device supports it."
        NSUserNotificationsUsageDescription: "Reminders will nudge you gently — never to shame you."
        CFBundleURLTypes:
          - CFBundleURLName: app.personalmanager.auth
            CFBundleURLSchemes:
              - personalmanager
        UIBackgroundModes: []       # Phase 2: add "audio" for background lo-fi
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PersonalManager/Resources/PersonalManager.entitlements
      properties:
        com.apple.security.application-groups: []
    dependencies:
      - package: Supabase
        product: Supabase
      - package: YouTubePlayerKit
        product: YouTubePlayerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.personalmanager.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Ember
        TARGETED_DEVICE_FAMILY: "1,2"

  PersonalManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PersonalManagerTests
    dependencies:
      - target: PersonalManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.personalmanager.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PersonalManager:
    build:
      targets:
        PersonalManager: all
        PersonalManagerTests: [test]
    test:
      targets:
        - PersonalManagerTests
    run:
      config: Debug
    archive:
      config: Release
